plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
}

// Use the existing release/upload key. Never fall back to the debug identity.
def releaseSigningProperties = new Properties()
def releaseSigningFile = rootProject.file('keystore.properties')
if (releaseSigningFile.isFile()) {
    releaseSigningFile.withInputStream { releaseSigningProperties.load(it) }
}
def releaseSigningValues = [
    storeFile: providers.environmentVariable('SIMPLEDEBT_KEYSTORE_FILE').orNull ?: releaseSigningProperties.getProperty('storeFile'),
    storePassword: providers.environmentVariable('SIMPLEDEBT_KEYSTORE_PASSWORD').orNull ?: releaseSigningProperties.getProperty('storePassword'),
    keyAlias: providers.environmentVariable('SIMPLEDEBT_KEY_ALIAS').orNull ?: releaseSigningProperties.getProperty('keyAlias'),
    keyPassword: providers.environmentVariable('SIMPLEDEBT_KEY_PASSWORD').orNull ?: releaseSigningProperties.getProperty('keyPassword')
]
// Android Studio's Generate Signed Bundle/APK wizard passes a complete override to AGP.
def studioSigningValues = [
    storeFile: providers.gradleProperty('android.injected.signing.store.file').orNull,
    storePassword: providers.gradleProperty('android.injected.signing.store.password').orNull,
    keyAlias: providers.gradleProperty('android.injected.signing.key.alias').orNull,
    keyPassword: providers.gradleProperty('android.injected.signing.key.password').orNull
]
def effectiveReleaseSigning = studioSigningValues.values().every { it != null } ? studioSigningValues : releaseSigningValues

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.isFile()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def appMetricaApiKey = (providers.environmentVariable('SIMPLEDEBT_APPMETRICA_API_KEY').orNull
    ?: localProperties.getProperty('appMetricaApiKey', '')).trim()

android {
    namespace "com.breckneck.debtbook"
    compileSdk 36

    defaultConfig {
        applicationId "com.breckneck.debtbook"
        minSdk 23
        targetSdk 36
        versionCode 45
        versionName "4.6.6"
        buildConfigField 'String', 'APPMETRICA_API_KEY', '""'
        buildConfigField 'boolean', 'DEMO_ADS', 'false'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (releaseSigningValues.storeFile) {
                storeFile rootProject.file(releaseSigningValues.storeFile)
            }
            storePassword releaseSigningValues.storePassword
            keyAlias releaseSigningValues.keyAlias
            keyPassword releaseSigningValues.keyPassword
        }
    }

    sourceSets {
        androidTest.assets.srcDirs += ["$rootDir/data/schemas"]
    }

    buildTypes {
        debug {
            buildConfigField 'boolean', 'DEMO_ADS', providers.gradleProperty('demoAds').map {
                Boolean.parseBoolean(it).toString()
            }.orElse('false').get()
        }
        release {
            buildConfigField 'String', 'APPMETRICA_API_KEY', groovy.json.JsonOutput.toJson(appMetricaApiKey)
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    buildFeatures{
        compose true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0'
            ]
        }
    }
}

def verifyAppMetricaApiKey = tasks.register('verifyAppMetricaApiKey') {
    group = 'verification'
    description = 'Require the Debt Book AppMetrica SDK API key for release builds.'
    doLast {
        if (!(appMetricaApiKey ==~ /(?i)[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}/)) {
            throw new GradleException('Configure the AppMetrica SDK API key in local.properties or SIMPLEDEBT_APPMETRICA_API_KEY; see docs/release-build.md.')
        }
    }
}

def verifyReleaseSigning = tasks.register('verifyReleaseSigning') {
    group = 'verification'
    description = 'Require an explicitly configured existing release/upload key.'
    doLast {
        if (effectiveReleaseSigning.values().any { !it }) {
            throw new GradleException('Release signing is not configured. Use Generate Signed Bundle/APK in Android Studio, set SIMPLEDEBT_* signing variables, or use an untracked keystore.properties; see docs/release-build.md.')
        }
        if (!rootProject.file(effectiveReleaseSigning.storeFile).isFile()) {
            throw new GradleException('The configured release keystore does not exist; see docs/release-build.md.')
        }
        if (effectiveReleaseSigning.keyAlias.equalsIgnoreCase('androiddebugkey')) {
            throw new GradleException('The Android debug key cannot be used for a release.')
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn verifyReleaseSigning, verifyAppMetricaApiKey
}

base {
    archivesName = "SimpleDebtBook-v${android.defaultConfig.versionName}(${android.defaultConfig.versionCode})"
}

androidComponents {
    onVariants(selector().withBuildType('debug')) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set(base.archivesName.map { "${it}.apk" })
        }
    }
}



kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

// The ads SDK can also pull in AppMetrica's screenshot event collector.
configurations.configureEach {
    exclude group: 'io.appmetrica.analytics', module: 'analytics-screenshot'
}

dependencies {

    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.room:room-runtime:2.8.4'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

//    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
    implementation("androidx.activity:activity-compose:1.13.0")
    implementation(platform("androidx.compose:compose-bom:2026.03.00"))
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.ui:ui-graphics")
    implementation("androidx.compose.ui:ui-tooling-preview")
    implementation("androidx.compose.material3:material3")
    implementation("androidx.compose.material:material-icons-extended")
    implementation("androidx.compose.runtime:runtime-livedata")
    androidTestImplementation(platform("androidx.compose:compose-bom:2026.03.00"))
    androidTestImplementation("androidx.compose.ui:ui-test-junit4")
    debugImplementation("androidx.compose.ui:ui-tooling")
    debugImplementation("androidx.compose.ui:ui-test-manifest")

    //Clean Architecture
    implementation project(path: ':domain')
    implementation project(path: ':data')
    implementation "androidx.room:room-runtime:2.8.4"

    //Navigation
    def nav_version = "2.9.7"
    implementation "androidx.navigation:navigation-compose:$nav_version"

    //Coil (image loading for Compose)
    implementation "io.coil-kt.coil3:coil-compose:3.1.0"
    implementation "io.coil-kt.coil3:coil-network-okhttp:3.1.0"

    //Yandex Mobile Ads
    implementation 'com.yandex.android:mobileads:8.6.0'
    implementation 'com.yandex.android:mobileads-compose:8.6.0'
    implementation 'io.appmetrica.analytics:analytics:8.6.0'

    //MVVM
    def lifecycle_version = "2.10.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"

    //Google Synchronization
    implementation "com.google.android.gms:play-services-auth:21.0.0"
    implementation("com.google.api-client:google-api-client-android:1.23.0") {
        exclude group: "org.apache.httpcomponents"
    }
    implementation ('com.google.http-client:google-http-client-gson:1.34.0') {
        exclude group: "org.apache.httpcomponents"
    }
    implementation("com.google.apis:google-api-services-drive:v3-rev136-1.25.0") {
        exclude group: "org.apache.httpcomponents"
    }

    //Hilt
    implementation 'com.google.dagger:hilt-android:2.59.2'
    ksp 'com.google.dagger:hilt-compiler:2.59.2'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'

    //Biometric auth
    implementation("androidx.biometric:biometric:1.1.0")

    //Orbit MVI
    implementation "org.orbit-mvi:orbit-core:10.0.0"
    implementation "org.orbit-mvi:orbit-viewmodel:10.0.0"
    implementation "org.orbit-mvi:orbit-compose:10.0.0"
    testImplementation "org.orbit-mvi:orbit-test:10.0.0"
}
